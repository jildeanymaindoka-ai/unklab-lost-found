<!-- Komponen bersama: report-card. Penanda kurung ganda diisi oleh js/app.js. -->
<!-- Kartu bergaya tiket/label barang: area gambar berpetak, garis sobekan, lalu isi. -->
<article class="card">
  <div class="item-art {{type}}">{{photoContent}}</div>
  <div class="card-body">
    <span class="badge {{badgeType}}">{{typeLabel}}</span>
    <span class="status">{{statusLabel}}</span>
    <h3>
      <a href="#detail/{{reportId}}">{{title}}</a>
    </h3>
    <p class="loc">{{location}}</p>
    <div class="card-foot">
      <span class="muted">{{date}}</span>
      <a href="#detail/{{reportId}}" tabindex="-1" aria-hidden="true">
        Lihat detail →
      </a>
    </div>
  </div>
</article>
